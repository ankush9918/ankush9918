<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="GitHub telemetry">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5d4"/><stop offset="0.5" stop-color="#7b61ff"/><stop offset="1" stop-color="#ff2e97"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.m{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
.lab{font-size:13px;letter-spacing:2px;fill:#6b7bb8}
.val{font-size:34px;font-weight:700;fill:#ffffff}
.ttl{font-size:16px;letter-spacing:5px;fill:#00f5d4}
.ln{font-size:16px;fill:#e6ecff}
.pc{font-size:15px;fill:#8fa0ff}
</style></defs>
<rect x="1" y="1" width="1198" height="318" rx="16" fill="#070b1c" stroke="url(#neon)" stroke-width="2"/>
<line x1="600" y1="30" x2="600" y2="290" stroke="#7b61ff" stroke-opacity="0.35" stroke-dasharray="4 8"/>
<text x="44" y="52" class="m ttl">// STATS</text>
<text x="44" y="100" class="m val" filter="url(#glow)">--</text>
<text x="44" y="124" class="m lab">STARS EARNED</text>
<text x="314" y="100" class="m val" filter="url(#glow)">--</text>
<text x="314" y="124" class="m lab">COMMITS (1Y)</text>
<text x="44" y="174" class="m val" filter="url(#glow)">--</text>
<text x="44" y="198" class="m lab">PULL REQUESTS</text>
<text x="314" y="174" class="m val" filter="url(#glow)">--</text>
<text x="314" y="198" class="m lab">ISSUES</text>
<text x="44" y="248" class="m val" filter="url(#glow)">--</text>
<text x="44" y="272" class="m lab">PUBLIC REPOS</text>
<text x="314" y="248" class="m val" filter="url(#glow)">--</text>
<text x="314" y="272" class="m lab">FOLLOWERS</text>
<text x="644" y="52" class="m ttl">// TOP LANGUAGES</text>
<text x="644" y="120" class="m ln">Waiting for first update...</text>
<text x="644" y="150" class="m pc">Actions tab -&gt; Update Profile Stats -&gt; Run workflow</text>
</svg>