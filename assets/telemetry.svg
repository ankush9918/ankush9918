<rect x="16" y="1" width="138" height="3" rx="1.5" fill="url(#gold)" opacity="0.9"/>
<text x="85" y="82" text-anchor="middle" class="serif val">--</text>
<text x="85" y="116" text-anchor="middle" class="sans lab">CONTRIBUTIONS</text>
</g>
