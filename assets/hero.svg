<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Ankush - AI-powered builder">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e8b0"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a67c1a"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="-100" y2="0">
      <stop offset="0" stop-color="#d4af37"/><stop offset="0.5" stop-color="#fff6d6"/><stop offset="1" stop-color="#d4af37"/>
      <animate attributeName="x1" values="-500;1300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1700" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset="0.5" stop-color="#d4af37" stop-opacity="0.9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#d4af37" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#05060a"/>
    <rect width="1200" height="400" fill="url(#lines)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- floating gold dust -->
    <circle cx="420" cy="70" r="2" fill="#f5d98b"><animate attributeName="cy" values="70;48;70" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="350" r="2" fill="#f5d98b"><animate attributeName="cy" values="350;322;350" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="110" r="1.6" fill="#ffffff"><animate attributeName="cy" values="110;86;110" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="330" r="2" fill="#f5d98b"><animate attributeName="cy" values="330;304;330" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="380" r="1.6" fill="#d4af37"><animate attributeName="cy" values="380;356;380" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.8;0.1" dur="8s" repeatCount="indefinite"/></circle>

    <!-- monogram ring -->
    <g transform="translate(1010 200)">
      <circle r="138" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 11">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
      <circle r="116" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="210 520" filter="url(#soft)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="92" fill="#080a12" stroke="#d4af37" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="0" y="40" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="112" font-weight="700" fill="url(#sweep)">A</text>
    </g>

    <!-- text block -->
    <line x1="80" y1="96" x2="130" y2="96" stroke="#d4af37" stroke-width="2"/>
    <text x="146" y="103" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="7" fill="#b9a25a">WELCOME TO MY PROFILE</text>

    <text x="76" y="212" font-family="Georgia,'Times New Roman',serif" font-size="126" font-weight="700" letter-spacing="12" fill="url(#sweep)">ANKUSH</text>

    <rect x="80" y="245" width="250" height="2" fill="url(#fade)"/>
    <rect x="352" y="240" width="12" height="12" transform="rotate(45 358 246)" fill="#d4af37"/>
    <rect x="388" y="245" width="252" height="2" fill="url(#fade)"/>

    <text x="80" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" letter-spacing="4" fill="#f4efe4">B.TECH IT STUDENT  ·  AI-POWERED BUILDER</text>

    <rect x="80" y="322" width="392" height="46" rx="23" fill="#d4af37" fill-opacity="0.08" stroke="#d4af37" stroke-opacity="0.6"/>
    <circle cx="108" cy="345" r="6" fill="#6fdc8c"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="128" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="3" fill="#f5d98b">AVAILABLE FOR FREELANCE</text>

    <!-- corner brackets -->
    <path d="M26 62 V26 H62" fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M1174 62 V26 H1138" fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M26 338 V374 H62" fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M1174 338 V374 H1138" fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="398" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
