<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Let's build something exceptional">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e8b0"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a67c1a"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="-100" y2="0">
      <stop offset="0" stop-color="#d4af37"/><stop offset="0.5" stop-color="#fff6d6"/><stop offset="1" stop-color="#d4af37"/>
      <animate attributeName="x1" values="-500;1300" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1700" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset="0.5" stop-color="#d4af37" stop-opacity="0.9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.16"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="190" rx="22" fill="#05060a"/>
  <rect width="1200" height="190" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="188" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="300" y="39" width="270" height="2" fill="url(#fade)"/>
  <rect x="594" y="34" width="12" height="12" transform="rotate(45 600 40)" fill="#d4af37"/>
  <rect x="630" y="39" width="270" height="2" fill="url(#fade)"/>
  <text x="600" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-style="italic" font-weight="700" fill="url(#sweep)">Let's build something exceptional.</text>
  <text x="600" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="7" fill="#a29c86">IDEAS IN  ·  WORKING PRODUCTS OUT</text>
</svg>
