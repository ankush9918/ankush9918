<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Currently building: AI Job Finder Agent">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e8b0"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a67c1a"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="-100" y2="0">
      <stop offset="0" stop-color="#d4af37"/><stop offset="0.5" stop-color="#fff6d6"/><stop offset="1" stop-color="#d4af37"/>
      <animate attributeName="x1" values="-500;1300" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1700" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset="0.5" stop-color="#f9e8b0"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.16"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="track"><rect x="60" y="226" width="1080" height="6" rx="3"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="22" fill="#05060a"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>

  <circle cx="68" cy="68" r="6" fill="#d4af37"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="88" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" letter-spacing="8" fill="#d4af37">CURRENTLY BUILDING</text>

  <rect x="900" y="44" width="240" height="42" rx="21" fill="#d4af37" fill-opacity="0.1" stroke="#d4af37" stroke-opacity="0.6"/>
  <text x="1020" y="71" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#f5d98b">IN DEVELOPMENT</text>

  <text x="60" y="150" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="700" fill="url(#sweep)">AI Job Finder Agent</text>
  <text x="60" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#c9c3ad">An autonomous agent that finds genuine jobs and internships every day, with no manual entry.</text>

  <rect x="60" y="226" width="1080" height="6" rx="3" fill="#14161f"/>
  <g clip-path="url(#track)">
    <rect x="60" y="226" width="260" height="6" fill="url(#bar)">
      <animate attributeName="x" values="-200;1140;-200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" letter-spacing="3" fill="#a29c86">
    <rect x="60" y="256" width="150" height="36" rx="18" fill="none" stroke="#d4af37" stroke-opacity="0.35"/><text x="135" y="279" text-anchor="middle">AI AGENT</text>
    <rect x="226" y="256" width="170" height="36" rx="18" fill="none" stroke="#d4af37" stroke-opacity="0.35"/><text x="311" y="279" text-anchor="middle">AUTOMATION</text>
    <rect x="412" y="256" width="200" height="36" rx="18" fill="none" stroke="#d4af37" stroke-opacity="0.35"/><text x="512" y="279" text-anchor="middle">DAILY UPDATES</text>
  </g>
</svg>
