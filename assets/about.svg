<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="About Ankush">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e8b0"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a67c1a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.12"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="470" rx="22" fill="#05060a"/>
  <rect width="1200" height="470" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="468" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>

  <text x="60" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" letter-spacing="9" fill="#d4af37">ABOUT</text>
  <rect x="200" y="67" width="940" height="2" fill="url(#fade)"/>

  <text x="60" y="140" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#f4efe4">B.Tech IT student who turns ideas into real products,</text>
  <text x="60" y="184" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic" fill="#f5d98b">websites, apps and AI agents, by building alongside AI.</text>

  <!-- card 1 -->
  <g transform="translate(60 228)">
    <rect width="350" height="206" rx="18" fill="#0b0d14" stroke="#d4af37" stroke-opacity="0.35"/>
    <rect x="20" y="1" width="310" height="3" rx="1.5" fill="url(#gold)" opacity="0.9"/>
    <g transform="translate(36 34)" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round">
      <rect x="0" y="4" width="56" height="42" rx="6"/>
      <line x1="0" y1="16" x2="56" y2="16"/>
      <circle cx="9" cy="10" r="1.6" fill="#d4af37"/><circle cx="16" cy="10" r="1.6" fill="#d4af37"/><circle cx="23" cy="10" r="1.6" fill="#d4af37"/>
      <line x1="10" y1="28" x2="34" y2="28"/><line x1="10" y1="37" x2="24" y2="37"/>
    </g>
    <text x="36" y="136" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#f4efe4">Websites</text>
    <text x="36" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">Portfolios, landing pages and</text>
    <text x="36" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">business sites. Fast and clean.</text>
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.1s" fill="freeze"/>
  </g>

  <!-- card 2 -->
  <g transform="translate(425 228)">
    <rect width="350" height="206" rx="18" fill="#0b0d14" stroke="#d4af37" stroke-opacity="0.35"/>
    <rect x="20" y="1" width="310" height="3" rx="1.5" fill="url(#gold)" opacity="0.9"/>
    <g transform="translate(46 30)" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="36" height="56" rx="8"/>
      <line x1="12" y1="6" x2="24" y2="6"/>
      <line x1="14" y1="48" x2="22" y2="48"/>
      <circle cx="18" cy="26" r="7"/>
    </g>
    <text x="36" y="136" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#f4efe4">Apps</text>
    <text x="36" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">Web and mobile apps, from</text>
    <text x="36" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">idea to a working MVP.</text>
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.35s" fill="freeze"/>
  </g>

  <!-- card 3 -->
  <g transform="translate(790 228)">
    <rect width="350" height="206" rx="18" fill="#0b0d14" stroke="#d4af37" stroke-opacity="0.35"/>
    <rect x="20" y="1" width="310" height="3" rx="1.5" fill="url(#gold)" opacity="0.9"/>
    <g transform="translate(36 34)" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round">
      <line x1="14" y1="14" x2="42" y2="14"/><line x1="14" y1="14" x2="28" y2="42"/><line x1="42" y1="14" x2="28" y2="42"/>
      <circle cx="14" cy="14" r="7" fill="#0b0d14"/><circle cx="42" cy="14" r="7" fill="#0b0d14"/>
      <circle cx="28" cy="42" r="8" fill="#d4af37" fill-opacity="0.25">
        <animate attributeName="fill-opacity" values="0.15;0.6;0.15" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="36" y="136" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#f4efe4">AI Agents</text>
    <text x="36" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">Autonomous workflows that</text>
    <text x="36" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#a29c86">automate boring manual work.</text>
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.6s" fill="freeze"/>
  </g>
</svg>
