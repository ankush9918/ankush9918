<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ankush — building useful digital products">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18243a"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#grid)" stroke="#334155"/>
  <circle cx="1080" cy="-35" r="220" fill="#7c3aed" fill-opacity=".12"/>
  <circle cx="1180" cy="370" r="230" fill="#34d399" fill-opacity=".07"/>

  <g transform="translate(78 62)">
    <rect width="575" height="236" rx="22" fill="#0f172a" fill-opacity=".86" stroke="#334155" filter="url(#soft-shadow)"/>
    <rect x="28" y="27" width="9" height="9" rx="4.5" fill="#fb7185"/>
    <rect x="47" y="27" width="9" height="9" rx="4.5" fill="#fbbf24"/>
    <rect x="66" y="27" width="9" height="9" rx="4.5" fill="#34d399"/>
    <text x="30" y="75" fill="#94a3b8" font-family="monospace" font-size="14">ankush / build-lab</text>
    <text x="30" y="126" fill="#f8fafc" font-family="sans-serif" font-size="42" font-weight="700">Build useful.</text>
    <text x="30" y="164" fill="#34d399" font-family="sans-serif" font-size="42" font-weight="700">Ship simply.</text>
    <text x="30" y="201" fill="#94a3b8" font-family="monospace" font-size="14">web apps  ·  AI tools  ·  automation</text>
  </g>

  <g transform="translate(750 54)">
    <text x="0" y="22" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="3">CURRENTLY BUILDING</text>
    <rect x="0" y="48" width="366" height="104" rx="18" fill="url(#card)" stroke="#334155"/>
    <circle cx="34" cy="83" r="9" fill="#34d399"/>
    <text x="58" y="88" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="700">AI job finder</text>
    <text x="58" y="116" fill="#94a3b8" font-family="monospace" font-size="13">find signal, skip the noise</text>
    <rect x="24" y="173" width="342" height="1" fill="#334155"/>
    <text x="0" y="211" fill="#a78bfa" font-family="monospace" font-size="14">IDEA</text>
    <path d="M48 206h72" stroke="#475569" stroke-width="2"/>
    <text x="137" y="211" fill="#34d399" font-family="monospace" font-size="14">BUILD</text>
    <path d="M197 206h72" stroke="#475569" stroke-width="2"/>
    <text x="286" y="211" fill="#f8fafc" font-family="monospace" font-size="14">SHIP</text>
  </g>
</svg>
