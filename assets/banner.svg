<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ankush — AI builder and product maker">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#eeebf7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#64748b" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#312e81" flood-opacity=".2"/>
    </filter>
    <clipPath id="art">
      <rect x="700" y="26" width="452" height="308" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#dots)" stroke="#d8d3e6"/>

  <g transform="translate(78 67)">
    <text x="0" y="18" fill="#7c3aed" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">ANKUSH / 2026</text>
    <text x="-5" y="104" fill="#111827" font-family="sans-serif" font-size="74" font-weight="900" letter-spacing="-3">BUILD</text>
    <text x="-5" y="174" fill="#111827" font-family="sans-serif" font-size="74" font-weight="900" letter-spacing="-3">WHAT'S</text>
    <text x="-5" y="244" fill="#7c3aed" font-family="sans-serif" font-size="74" font-weight="900" letter-spacing="-3">NEXT.</text>
    <rect x="0" y="270" width="360" height="2" fill="#111827" opacity=".18"/>
    <text x="0" y="298" fill="#475569" font-family="monospace" font-size="13" letter-spacing="1">AI BUILDER  ·  PRODUCT MAKER  ·  CREATOR</text>
  </g>

  <g clip-path="url(#art)" filter="url(#shadow)">
    <rect x="700" y="26" width="452" height="308" rx="28" fill="#161126"/>
    <circle cx="1002" cy="166" r="184" fill="url(#violet)"/>
    <circle cx="1088" cy="80" r="105" fill="#f9a8d4" opacity=".34"/>
    <circle cx="785" cy="307" r="140" fill="url(#aqua)" opacity=".8"/>
    <path d="M650 256C772 92 947 69 1195 176" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
    <path d="M671 297C812 133 1003 117 1200 207" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M735 31v316M802 31v316M869 31v316M936 31v316M1003 31v316M1070 31v316" stroke="#fff" stroke-opacity=".1"/>
    <path d="M700 91h452M700 154h452M700 217h452M700 280h452" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="946" cy="176" r="60" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
    <circle cx="946" cy="176" r="12" fill="#fff"/>
    <circle cx="946" cy="176" r="82" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1"/>
    <path d="M946 94v164M864 176h164" stroke="#fff" stroke-opacity=".28"/>
  </g>

  <g transform="translate(747 57)">
    <rect width="127" height="29" rx="14.5" fill="#fff" fill-opacity=".92"/>
    <circle cx="18" cy="14.5" r="4" fill="#22c55e"/>
    <text x="31" y="19" fill="#312e81" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">ONLINE</text>
  </g>

  <g transform="translate(1018 286)">
    <text x="0" y="0" fill="#fff" font-family="monospace" font-size="12" letter-spacing="2">IDEA → INTERFACE</text>
    <text x="0" y="20" fill="#fff" fill-opacity=".65" font-family="monospace" font-size="11" letter-spacing="1">→ INTELLIGENT SYSTEM</text>
  </g>
</svg>
