<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ankush - AI Powered Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03040d"/>
      <stop offset="0.5" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#1b0933"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7b61ff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="70" y="208" width="640" height="40"/>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <rect x="0" y="0" width="1280" height="320" fill="url(#grid)"/>

    <rect x="0" y="110" width="1200" height="90" fill="url(#scan)"/>

    <!-- circuit lines -->
    <path d="M0 312 H150 L176 296 H300 L322 312 H560" fill="none" stroke="#00f5d4" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M1200 40 H1010 L985 66 H800 L780 46 H640" fill="none" stroke="#ff2e97" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 10"/>

    <!-- particles -->
    <circle cx="300" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="520" cy="120" r="2" fill="#00f5d4" opacity="0.5"/>
    <circle cx="700" cy="250" r="2" fill="#ff2e97" opacity="0.5"/>
    <circle cx="820" cy="100" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="160" cy="200" r="2" fill="#7b61ff" opacity="0.5"/>
    <circle cx="920" cy="270" r="2" fill="#00f5d4" opacity="0.5"/>

    <!-- HUD ring -->
    <g transform="translate(1030 160)">
      <circle r="100" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="4 12" opacity="0.9"/>
      <circle r="76" fill="none" stroke="#ff2e97" stroke-width="3" stroke-dasharray="40 24" opacity="0.8"/>
      <circle r="52" fill="#0a0f2c" stroke="#00f5d4" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="12" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="900" fill="url(#neon)" filter="url(#glow)">AI</text>
    </g>

    <!-- tag line -->
    <text x="70" y="84" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="16" letter-spacing="5" fill="#00f5d4">
      // WELCOME TO MY DIGITAL LAB
    </text>

    <!-- name -->
    <text x="70" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="900" letter-spacing="6" fill="url(#neon)" filter="url(#glow)">ANKUSH</text>

    <!-- typed subtitle -->
    <g clip-path="url(#typeclip)">
      <text x="70" y="236" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="22" fill="#e6ecff">&gt; AI-POWERED BUILDER · B.TECH IT · FREELANCER</text>
    </g>
    <!-- status strip -->
    <circle cx="76" cy="292" r="5" fill="#27c93f"/>
    <text x="92" y="297" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" letter-spacing="2" fill="#8fa0ff">STATUS: ONLINE  |  OPEN TO FREELANCE  |  BUILDING WITH AI AGENTS</text>

    <!-- HUD corners -->
    <path d="M22 56 V22 H56" fill="none" stroke="#00f5d4" stroke-width="3"/>
    <path d="M1178 56 V22 H1144" fill="none" stroke="#ff2e97" stroke-width="3"/>
    <path d="M22 264 V298 H56" fill="none" stroke="#7b61ff" stroke-width="3"/>
    <path d="M1178 264 V298 H1144" fill="none" stroke="#00f5d4" stroke-width="3"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.6" stroke-width="2"/>
</svg>
