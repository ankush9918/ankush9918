<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ankush - AI Powered Builder">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity="0.12"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b1120"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="720" y="-80" width="560" height="480" rx="280" fill="#1e3a8a" opacity="0.16"/>

    <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#border)" stroke-width="2"/>

    <rect x="64" y="58" width="5" height="204" rx="2.5" fill="#22d3ee"/>
    <text x="92" y="76" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="15" letter-spacing="3" fill="#67e8f9">PROFILE / 01</text>

    <text x="92" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="2" fill="#f8fafc">ANKUSH</text>
    <rect x="94" y="178" width="94" height="4" rx="2" fill="#22d3ee"/>

    <text x="92" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#cbd5e1">AI-powered builder</text>
    <text x="92" y="250" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" letter-spacing="1.5" fill="#94a3b8">WEB  ·  APPS  ·  AUTOMATION  ·  AI AGENTS</text>

    <g transform="translate(902 160)" filter="url(#soft-shadow)">
      <rect x="-168" y="-102" width="336" height="204" rx="18" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
      <circle r="62" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle r="46" fill="#0b1120" stroke="#818cf8" stroke-width="1.5"/>
      <path d="M-25 0H25M0-25V25" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <circle r="7" fill="#22d3ee"/>
      <text x="0" y="78" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" letter-spacing="2" fill="#cbd5e1">BUILD / SHIP / REPEAT</text>
    </g>
  </g>
</svg>
