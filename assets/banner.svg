<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ankush — AI builder and product maker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#21183d"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="45%" cy="35%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#818cf8" stop-opacity=".48"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-opacity=".065"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#grid)" stroke="#374151"/>

  <circle cx="1010" cy="170" r="220" fill="url(#orb)" opacity=".7"/>
  <circle cx="1100" cy="40" r="150" fill="#c084fc" opacity=".08"/>
  <circle cx="1130" cy="350" r="170" fill="#22d3ee" opacity=".06"/>

  <g transform="translate(82 71)">
    <rect width="560" height="220" rx="22" fill="#0b1020" fill-opacity=".72" stroke="#334155" filter="url(#shadow)"/>
    <rect x="30" y="28" width="9" height="9" rx="4.5" fill="#fb7185"/>
    <rect x="49" y="28" width="9" height="9" rx="4.5" fill="#fbbf24"/>
    <rect x="68" y="28" width="9" height="9" rx="4.5" fill="#34d399"/>
    <text x="30" y="75" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="2">HELLO, I'M</text>
    <text x="28" y="137" fill="url(#name)" font-family="sans-serif" font-size="62" font-weight="800" letter-spacing="5">ANKUSH</text>
    <rect x="30" y="158" width="420" height="2" fill="url(#line)"/>
    <text x="30" y="190" fill="#e2e8f0" font-family="monospace" font-size="15" letter-spacing="2">AI BUILDER  ·  PRODUCT MAKER</text>
  </g>

  <g transform="translate(885 179)" fill="none" stroke-linecap="round">
    <circle r="114" stroke="#a78bfa" stroke-opacity=".22" stroke-width="1"/>
    <ellipse rx="146" ry="48" transform="rotate(-24)" stroke="#67e8f9" stroke-opacity=".34" stroke-width="2"/>
    <ellipse rx="146" ry="48" transform="rotate(36)" stroke="#c084fc" stroke-opacity=".3" stroke-width="2"/>
    <circle r="53" fill="#151a38" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
    <circle r="27" fill="#20264b" stroke="#c4b5fd" stroke-width="2"/>
    <circle r="8" fill="#67e8f9" stroke="none" filter="url(#glow)"/>
    <circle cx="132" cy="-39" r="5" fill="#f0abfc" stroke="none"/>
    <circle cx="-106" cy="56" r="4" fill="#67e8f9" stroke="none"/>
  </g>

  <g transform="translate(753 286)">
    <rect width="294" height="32" rx="16" fill="#0b1020" fill-opacity=".78" stroke="#374151"/>
    <circle cx="20" cy="16" r="5" fill="#34d399"/>
    <text x="35" y="21" fill="#cbd5e1" font-family="monospace" font-size="12" letter-spacing="1">BUILD  ·  SHIP  ·  REPEAT</text>
  </g>
</svg>
