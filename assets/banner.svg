<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ankush - AI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1f"/>
      <stop offset="1" stop-color="#15113b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="url(#grid)" stroke="#334155"/>
  <circle cx="1010" cy="-20" r="190" fill="#7c3aed" fill-opacity=".16"/>
  <circle cx="1110" cy="300" r="170" fill="#06b6d4" fill-opacity=".10"/>
  <path d="M680 56h430M680 80h300M680 104h360" stroke="#475569" stroke-opacity=".55"/>
  <rect x="70" y="58" width="500" height="204" rx="16" fill="#0b1229" fill-opacity=".88" stroke="#334155"/>
  <circle cx="98" cy="86" r="5" fill="#fb7185"/><circle cx="116" cy="86" r="5" fill="#facc15"/><circle cx="134" cy="86" r="5" fill="#4ade80"/>
  <text x="92" y="132" fill="#64748b" font-family="monospace" font-size="14">~/ankush/build-lab</text>
  <text x="92" y="174" fill="#22d3ee" font-family="monospace" font-size="26" font-weight="700">ANKUSH</text>
  <text x="92" y="208" fill="#e2e8f0" font-family="monospace" font-size="18">AI BUILDER <tspan fill="#818cf8">//</tspan> PRODUCT MAKER</text>
  <text x="92" y="238" fill="#64748b" font-family="monospace" font-size="13">ideas → interfaces → intelligent systems</text>
  <g transform="translate(720 148)" filter="url(#glow)">
    <path d="M0 0h150M75 -75v150" stroke="url(#cyan)" stroke-width="2"/>
    <circle r="52" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle r="32" fill="#111936" stroke="#818cf8" stroke-width="2"/>
    <circle r="7" fill="#22d3ee"/>
  </g>
  <text x="865" y="145" fill="#22d3ee" font-family="monospace" font-size="14" letter-spacing="3">BUILD</text>
  <text x="865" y="174" fill="#818cf8" font-family="monospace" font-size="14" letter-spacing="3">SHIP</text>
  <text x="865" y="203" fill="#e2e8f0" font-family="monospace" font-size="14" letter-spacing="3">REPEAT</text>
  <path d="M865 220h170" stroke="#334155"/>
  <text x="865" y="246" fill="#64748b" font-family="monospace" font-size="12">STATUS: ONLINE</text>
</svg>