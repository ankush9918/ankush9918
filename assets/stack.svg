<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-weight: 700; }
      .hex { fill: #0a1030; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#070b1c" stroke="url(#neon)" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" class="t" font-size="20" letter-spacing="6" fill="#8fa0ff">// POWER MODULES</text>

  <!-- hexagon: points relative to center, radius 52 -->
  <g transform="translate(110 150)">
    <polygon class="hex" stroke="#e34f26" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="18" fill="#ff7a4d">HTML</text>
  </g>

  <g transform="translate(275 150)">
    <polygon class="hex" stroke="#2d9cff" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="18" fill="#59b4ff">CSS</text>
  </g>

  <g transform="translate(440 150)">
    <polygon class="hex" stroke="#f7df1e" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="20" fill="#f7df1e">JS</text>
  </g>

  <g transform="translate(605 150)">
    <polygon class="hex" stroke="#3fa9ff" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="17" fill="#6ec1ff">PYTHON</text>
  </g>

  <g transform="translate(770 150)">
    <polygon class="hex" stroke="#00f5d4" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="18" fill="#00f5d4">REACT</text>
  </g>

  <g transform="translate(935 150)">
    <polygon class="hex" stroke="#7b61ff" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="7" font-size="18" fill="#a592ff">GIT</text>
  </g>

  <g transform="translate(1090 150)">
    <polygon class="hex" stroke="#ff2e97" filter="url(#glow)" points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28"/>
    <text class="t" text-anchor="middle" y="-2" font-size="18" fill="#ff6fb8">AI</text>
    <text class="t" text-anchor="middle" y="18" font-size="13" fill="#ff6fb8">AGENTS</text>
  </g>

  <text x="600" y="268" text-anchor="middle" class="t" font-size="15" letter-spacing="3" fill="#6b7bb8">BUILT FAST · SHIPPED WITH AI</text>
</svg>
