<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e8b0"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#a67c1a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="22" fill="#05060a"/>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>

  <text x="60" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" letter-spacing="9" fill="#d4af37">TECH STACK</text>
  <rect x="320" y="67" width="820" height="2" fill="url(#fade)"/>

  <style>
    .chip { fill: #0b0d14; stroke: #d4af37; stroke-opacity: 0.45; }
    .nm { font-family: Georgia,'Times New Roman',serif; font-size: 28px; font-weight: 700; fill: #f4efe4; }
  </style>

  <!-- row 1 -->
  <g transform="translate(55 108)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">HTML5</text></g>
  <g transform="translate(330 108)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">CSS3</text></g>
  <g transform="translate(605 108)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">JavaScript</text></g>
  <g transform="translate(880 108)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">Python</text></g>

  <!-- row 2 -->
  <g transform="translate(55 208)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">React</text></g>
  <g transform="translate(330 208)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">Node.js</text></g>
  <g transform="translate(605 208)"><rect class="chip" width="250" height="72" rx="36"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#d4af37"/><text class="nm" x="64" y="47">Git &amp; GitHub</text></g>
  <g transform="translate(880 208)"><rect class="chip" width="250" height="72" rx="36" stroke-opacity="0.9"/><rect x="34" y="30" width="12" height="12" transform="rotate(45 40 36)" fill="#f5d98b"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></rect><text class="nm" x="64" y="47" fill="#f5d98b" style="fill:#f5d98b">AI Agents</text></g>
</svg>
